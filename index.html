<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Journal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
        #login-box { background: #1e293b; padding: 40px; border-radius: 16px; text-align: center; border: 1px solid #334155; width: 100%; max-width: 400px; margin-top: 20vh; }
        #login-box h1 { margin-bottom: 10px; }
        #login-box p { color: #94a3b8; margin-bottom: 20px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; width: 100%; margin-bottom: 16px; text-align: center; font-size: 1rem; }
        button { padding: 12px 30px; background: #22c55e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; width: 100%; }
        button:hover { background: #16a34a; }
        #error-msg { color: #f87171; margin-top: 12px; display: none; }
        #main-content { display: none; width: 100%; max-width: 800px; }
        header { border-bottom: 2px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
        header h1 { font-size: 1.8rem; }
        .entry-card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #334155; }
        .date { color: #94a3b8; font-size: 0.85rem; margin-bottom: 8px; }
        .entry-card h2 { margin-bottom: 12px; color: #22c55e; font-size: 1.2rem; }
        .entry-card p { line-height: 1.7; color: #cbd5e1; margin-bottom: 16px; }
        .theme-tag { background: #064e3b; color: #4ade80; padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; margin-right: 5px; display: inline-block; margin-bottom: 4px; }
        #loading { text-align: center; color: #94a3b8; padding: 40px; }
    </style>
</head>
<body>

<div id="login-box">
    <h1>🔒 Private Vault</h1>
    <p>Enter your secret code to view entries</p>
    <input type="password" id="pass-input" placeholder="Password..." onkeydown="if(event.key==='Enter') unlock()">
    <button onclick="unlock()">Unlock</button>
    <p id="error-msg">Wrong password!</p>
</div>

<div id="main-content">
    <header>
        <h1>📔 My Voice Journal</h1>
    </header>
    <div id="entries-list">
        <div id="loading">Loading entries...</div>
    </div>
</div>

<script>
    let savedPassword = "";

    async function unlock() {
        const pass = document.getElementById('pass-input').value;
        if (!pass) return;

        const res = await fetch(`https://journal-server-vqkc.onrender.com/entries?password=${encodeURIComponent(pass)}`);
        const data = await res.json();

        if (data.error) {
            document.getElementById('error-msg').style.display = 'block';
            return;
        }

        savedPassword = pass;
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        renderEntries(data);
    }

    function renderEntries(entries) {
        const list = document.getElementById('entries-list');
        if (!entries || entries.length === 0) {
            list.innerHTML = '<p style="text-align:center;color:#94a3b8;">No entries yet. Start speaking!</p>';
            return;
        }
        list.innerHTML = '';
        entries.forEach(entry => {
            const themes = entry.themes ? entry.themes.split(',').map(t => `<span class="theme-tag">${t.trim()}</span>`).join('') : '';
            const card = document.createElement('div');
            card.className = 'entry-card';
            card.innerHTML = `
                <div class="date">📅 ${entry.date} ${entry.time ? '· ' + entry.time : ''}</div>
                <h2>${entry.title || 'Untitled'}</h2>
                <p>${entry.body || ''}</p>
                <div>${themes}</div>
            `;
            list.appendChild(card);
        });
    }
</script>
</body>
</html>
